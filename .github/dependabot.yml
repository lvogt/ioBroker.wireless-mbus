# Dependabot configuration
#
# Cooldown delays normal npm updates by 7 days so freshly published versions
# settle before we see them; security updates are exempt and arrive at once.
# Cooldown is not supported for the github-actions ecosystem.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  # npm runs on day 23 of each month at 01:27 (Europe/Berlin)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "27 1 23 * *"
    assignees:
      - lvogt
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint (pulled in by @iobroker/eslint-config) peer-depends
      # on "typescript >=4.8.4 <6.1.0". Anything at or above 6.1 makes npm ci
      # fail with ERESOLVE, so only patch updates are safe for now. Remove
      # this entry once typescript-eslint widens its peer range.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # @types/node tracks the *minimum* supported node version, not the newest
      # one. engines.node is ">=22", so staying on ^22 is what makes tsc reject
      # APIs that would be missing at runtime for users on that floor.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # github-actions runs on day 10 of each month at 02:44 (Europe/Berlin)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "44 2 10 * *"
    assignees:
      - lvogt
    open-pull-requests-limit: 15
